name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  # The shared release workflow pushes the same packages to nuget.org and, when
  # PURVIEW_PUBLISH_GITHUB_PACKAGES=true, to GitHub Packages. A reusable workflow cannot grant
  # more than its caller, so the permission is declared here.
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release packages
    uses: purview-dev/build/.github/workflows/purview-release.yml@main
    with:
      release-mode: NuGet
      release-branch: main
    secrets: inherit
