name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    uses: purview-dev/build/.github/workflows/purview-build.yml@main
    secrets: inherit

  samples:
    name: Build and test samples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # global.json is the source of truth: the repo targets net11.0, and a floating
          # 10.0.x here leaves the SDK pinned by global.json uninstalled.
          global-json-file: global.json

      - name: Build SampleApp
        run: dotnet build samples/SampleApp/SampleApp.slnx --configuration Release

      - name: Test SampleApp
        run: dotnet test samples/SampleApp/SampleApp.slnx --configuration Release --no-build
