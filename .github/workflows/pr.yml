name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    uses: purview-dev/build/.github/workflows/purview-build.yml@main
    secrets: inherit

  samples:
    name: Build and test samples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # global.json is the source of truth: the repo targets net11.0, and a floating
          # 10.0.x here leaves the SDK pinned by global.json uninstalled.
          global-json-file: global.json

      - name: Build SampleApp
        run: dotnet build samples/SampleApp/SampleApp.slnx --configuration Release

      - name: Build SampleApp.MultiProject
        run: dotnet build samples/SampleApp.MultiProject/SampleApp.MultiProject.slnx --configuration Release

      # The samples reference the generator project as an analyzer, which is exactly how
      # Purview.SourceGeneratorFramework.dll reached every sample's bin with SGF 1.2.1. Scan
      # every sample project's build output for compiler-host assemblies.
      - name: Scan the sample build output for compiler-host assemblies
        shell: pwsh
        run: >-
          ./scripts/assert-no-compiler-host-assemblies.ps1
          -Path (Get-ChildItem samples/SampleApp, samples/SampleApp.MultiProject -Directory |
          ForEach-Object { Join-Path $_.FullName bin } | Where-Object { Test-Path $_ })

      - name: Test SampleApp
        run: dotnet test samples/SampleApp/SampleApp.slnx --configuration Release --no-build

  # Proving that each ForbiddenContent rule bites is cheap - pack the generator, then validate injected copies of it -
  # so it runs in its own job rather than as the last step of `packed-consumers`. There it could only fail after the
  # Native AOT and WebAssembly AOT publishes had already spent seven minutes.
  #
  # Like `samples`, it needs no feed wiring of its own: the shared `build` job registers the organisation's GitHub
  # Packages source when a pinned version is not on nuget.org yet, and the pack below fails in seconds, naming the
  # package and version, if one cannot be restored.
  pack-validation:
    name: Pack validation rule proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Restore before pack: a pwsh step that left `dotnet tool restore`'s non-zero exit code to the shell's
      # trailing `exit $LASTEXITCODE` is what made this gate report a green run as a failure. Reaching a step at
      # all must mean it succeeded, so the failure is raised here, with the message above it.
      - name: Pack the generator and validate its content
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) {
            throw 'dotnet tool restore failed: a transient NuGet failure, or the manifest asks for a command the pinned package does not carry.'
          }
          dotnet purview-build `
            --Build:RunPack=true `
            --Build:ValidatePack=true `
            --Build:RunTests=false `
            --Build:RunLint=false `
            --Release:Mode=None

      - name: Prove every pack-validation forbidden-content rule rejects a package
        shell: pwsh
        run: ./scripts/test-pack-validation-rules.ps1 -PackagesFolder artifacts

  packed-consumers:
    name: Packed consumers (Native AOT, Blazor WebAssembly, Blazor Server)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # First, before any toolchain is installed: the generator is built against the
      # Purview.SourceGeneratorFramework version Directory.Packages.props pins, with the
      # Purview.BuildSdk version global.json pins, so nothing can be packed until both restore.
      # This fails with what to do rather than skipping.
      - name: Check the prerelease build dependencies restore
        shell: pwsh
        run: ./scripts/test-packed-consumers.ps1 -PreflightOnly

      # Native AOT links with clang and needs the zlib headers; the hosted image may not carry both.
      - name: Install the Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # RunAOTCompilation needs the Emscripten toolchain and the Mono AOT cross compiler.
      # -WasmAot Require below makes a missing workload an error instead of a skipped step.
      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Pack, then publish, run and leak-scan consumers of the package
        shell: pwsh
        run: >-
          ./scripts/test-packed-consumers.ps1 -RuntimeIdentifier linux-x64 -WasmAot Require
          -PackOutput artifacts/packed
